<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">Corrected Gettysburg Address fibril</title>
  <desc id="desc">Twenty sequential slices plotted as points in signal and information space, divided into four quadrants and connected in original order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#4c2a85"/></marker>
  </defs>
  <rect width="1100" height="700" fill="#f4f1ea"/>
  <text x="70" y="44" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#171717">GETTYSBURG FIBRIL — CORRECTED GEOMETRY</text>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="16" fill="#555">Each numbered slice is one coordinate; the line preserves original order</text>

  <rect x="100" y="90" width="440" height="230" fill="#dedbd3"/>
  <rect x="540" y="90" width="440" height="230" fill="#ffffff"/>
  <rect x="100" y="320" width="440" height="230" fill="#ffffff"/>
  <rect x="540" y="320" width="440" height="230" fill="#dedbd3"/>

  <g stroke="#c8c5bd" stroke-width="1">
    <line x1="188" y1="90" x2="188" y2="550"/><line x1="276" y1="90" x2="276" y2="550"/>
    <line x1="364" y1="90" x2="364" y2="550"/><line x1="452" y1="90" x2="452" y2="550"/>
    <line x1="628" y1="90" x2="628" y2="550"/><line x1="716" y1="90" x2="716" y2="550"/>
    <line x1="804" y1="90" x2="804" y2="550"/><line x1="892" y1="90" x2="892" y2="550"/>
    <line x1="100" y1="136" x2="980" y2="136"/><line x1="100" y1="182" x2="980" y2="182"/>
    <line x1="100" y1="228" x2="980" y2="228"/><line x1="100" y1="274" x2="980" y2="274"/>
    <line x1="100" y1="366" x2="980" y2="366"/><line x1="100" y1="412" x2="980" y2="412"/>
    <line x1="100" y1="458" x2="980" y2="458"/><line x1="100" y1="504" x2="980" y2="504"/>
  </g>
  <line x1="540" y1="90" x2="540" y2="550" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="320" x2="980" y2="320" stroke="#333" stroke-width="2"/>
  <rect x="100" y="90" width="880" height="460" fill="none" stroke="#171717" stroke-width="2"/>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#555">
    <text x="118" y="116">HIGH SIGNAL · LOW INFORMATION</text>
    <text x="962" y="116" text-anchor="end">HIGH SIGNAL · HIGH INFORMATION</text>
    <text x="118" y="532">LOW SIGNAL · LOW INFORMATION</text>
    <text x="962" y="532" text-anchor="end">LOW SIGNAL · HIGH INFORMATION</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#333">
    <text x="100" y="574" text-anchor="middle">0</text><text x="540" y="574" text-anchor="middle">5</text><text x="980" y="574" text-anchor="middle">10</text>
    <text x="82" y="555" text-anchor="end">0</text><text x="82" y="325" text-anchor="end">5</text><text x="82" y="95" text-anchor="end">10</text>
    <text x="540" y="622" text-anchor="middle" font-size="18" font-weight="700">Information density →</text>
    <text x="27" y="320" text-anchor="middle" font-size="18" font-weight="700" transform="rotate(-90 27 320)">Signal strength →</text>
  </g>

  <polyline points="804,320 628,228 716,136 804,182 804,136 892,320 804,320 804,136 540,320 628,90 716,136 452,182 540,228 540,90 716,182 628,182 716,136 716,90 892,90 804,90" fill="none" stroke="#4c2a85" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" opacity=".82"/>

  <g fill="#f4f1ea" stroke="#4c2a85" stroke-width="3">
    <circle cx="804" cy="320" r="12"/><circle cx="628" cy="228" r="12"/><circle cx="716" cy="136" r="12"/>
    <circle cx="804" cy="182" r="12"/><circle cx="804" cy="136" r="12"/><circle cx="892" cy="320" r="12"/>
    <circle cx="804" cy="320" r="8"/><circle cx="804" cy="136" r="8"/><circle cx="540" cy="320" r="12"/>
    <circle cx="628" cy="90" r="12"/><circle cx="716" cy="136" r="8"/><circle cx="452" cy="182" r="12"/>
    <circle cx="540" cy="228" r="12"/><circle cx="540" cy="90" r="12"/><circle cx="716" cy="182" r="12"/>
    <circle cx="628" cy="182" r="12"/><circle cx="716" cy="136" r="5"/><circle cx="716" cy="90" r="12"/>
    <circle cx="892" cy="90" r="12"/><circle cx="804" cy="90" r="12"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#171717">
    <text x="786" y="347">1</text><text x="609" y="216">2</text><text x="688" y="127">3</text>
    <text x="824" y="188">4</text><text x="824" y="127">5</text><text x="913" y="326">6</text>
    <text x="786" y="306">7</text><text x="789" y="161">8</text><text x="520" y="347">9</text>
    <text x="600" y="122">10</text><text x="686" y="159">11</text><text x="425" y="171">12</text>
    <text x="559" y="248">13</text><text x="515" y="122">14</text><text x="744" y="204">15</text>
    <text x="600" y="173">16</text><text x="735" y="121">17</text><text x="688" y="82">18</text>
    <text x="913" y="82">19</text><text x="816" y="82">20</text>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="130" y="645" width="840" height="34" rx="4" fill="#e7e0f2" stroke="#4c2a85"/>
    <text x="550" y="667" text-anchor="middle" font-size="15" font-weight="700" fill="#2f175d">THE CLIMAX MOVES INTO HIGH SIGNAL / HIGH INFORMATION — NOT MERELY “LOUDER”</text>
  </g>
</svg>